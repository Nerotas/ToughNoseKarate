name: Deploy Frontend to Netlify

on:
  push:
    branches: [main, staging]
    paths: ["FrontEnd/**", "netlify.toml", ".github/workflows/frontend-deploy.yml"]
  pull_request:
    branches: [main]
    paths: ["FrontEnd/**", "netlify.toml", ".github/workflows/frontend-deploy.yml"]

env:
  NODE_VERSION: "20"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: FrontEnd/package-lock.json

      - name: Install dependencies
        working-directory: ./FrontEnd
        run: npm ci

        # TBD after tests are built

      - name: Run tests
        working-directory: ./FrontEnd
        run: npm run test -- --passWithNoTests

      - name: Build application
        working-directory: ./FrontEnd
        run: npx netlify build --offline --context production
        env:
          NEXT_PUBLIC_API_PATH: https://api.toughnosekarate.com
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_API_VERSION: v1
          NEXT_PUBLIC_ENABLE_DEBUG: false

      - name: Deploy to Netlify (Production)
        if: github.ref == 'refs/heads/main'
        working-directory: ./FrontEnd
        run: npx netlify deploy --prod --context production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
